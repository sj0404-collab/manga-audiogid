name: build-apk

# Сборка APK в GitHub: юнит-тесты + два релизных APK (arm64-v8a и armeabi-v7a).
# Подпись берётся из секретов репозитория: KEYSTORE_B64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD. Нет секретов — соберётся debug-APK.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Ключ подписи
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/bibliogid-release.jks
          {
            echo "storeFile=keystore/bibliogid-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ls -la keystore

      - name: Юнит-тесты
        run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest

      - name: Релизные APK
        run: >
          gradle --no-daemon --max-workers=1
          -x lintVitalAnalyzeRelease -x lintVitalRelease
          :app:assembleRelease

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
