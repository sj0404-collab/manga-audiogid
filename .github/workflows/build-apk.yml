name: build-apk

# Сборка APK в GitHub: тесты + два релизных APK (arm64-v8a и armeabi-v7a).
# Подпись берётся из секретов репозитория (KEYSTORE_B64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD). Если секретов нет — собирается debug-APK.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Юнит-тесты
        run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest

      - name: Ключ подписи (если задан секрет)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/bibliogid-release.jks
          {
            echo "storeFile=keystore/bibliogid-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Сборка релизных APK
        run: >
          gradle --no-daemon --max-workers=1
          -x lintVitalAnalyzeRelease -x lintVitalRelease
          :app:assembleRelease

      - name: Запасной вариант — debug-APK
        if: failure()
        run: gradle --no-daemon --max-workers=1 :app:assembleDebug

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
